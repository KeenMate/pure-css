<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — utilities</title>
    <link rel="stylesheet" href="/dist/css/pure-css.css">
    <link rel="stylesheet" href="/test/test-fixtures.css">
</head>
<body>
    <h1>utilities</h1>

    <div class="fixture">
        <div class="fixture-label">spacing scale (10px rem base)</div>
        <!-- .m-4 = 1rem = 10px ; .p-2 = 0.5rem = 5px -->
        <div id="margin" class="probe m-4">m-4</div>
        <div id="padding" class="probe p-2">p-2</div>
    </div>

    <div class="fixture">
        <div class="fixture-label">width fraction</div>
        <div id="w-parent" style="width: 200px;">
            <div id="w-half" class="probe w-1-2">w-1-2</div>
        </div>
    </div>

    <div class="fixture">
        <div class="fixture-label">display + flex</div>
        <div id="flex" class="d-flex justify-content-center">
            <span class="probe">a</span>
        </div>
        <div id="hidden" class="d-none">hidden</div>
        <div id="centered" class="text-center">centered text</div>
    </div>

    <div class="fixture">
        <div class="fixture-label">semantic text colour</div>
        <span id="primary" class="text-primary">accent-coloured text</span>
    </div>
</body>
</html>
